# Every value below can be overridden by an environment variable using
# Spring's relaxed binding (spring.neo4j.uri -> SPRING_NEO4J_URI), so the
# defaults here target the local `docker compose` stack and nothing else.
#
# NOTHING IN THIS FILE MAY BE A REAL CREDENTIAL.

spring.application.name=famt-be

# --- MongoDB (tenants, users, audit logs) --------------------------------
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/famt}

# --- Neo4j (people, relationships, locations, events) --------------------
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:famtree-local-dev}

# --- JWT -----------------------------------------------------------------
# HS256 key; jjwt rejects anything shorter than 32 bytes at runtime.
# Generate per environment: openssl rand -base64 48
jwt.secret=${JWT_SECRET:local-development-only-secret-key-at-least-32-bytes-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Email (welcome PIN + OTP) -------------------------------------------
# Defaults point at Mailpit from the compose stack: no real SMTP account
# needed, and every message is readable at http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:dev@famtree.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

# --- Application ---------------------------------------------------------
app.name=${APP_NAME:Famtree Application}
server.port=${SERVER_PORT:8080}

# --- Actuator ------------------------------------------------------------
# Health is what compose and CI poll to know the app is really up.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
